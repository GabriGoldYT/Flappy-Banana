  let W = 480, H = 800, dpr = 1;

  function resize() {
    const r = wrap.getBoundingClientRect();
    W = Math.max(320, r.width);
    H = Math.max(520, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  const state = {
    started: false,
    over: false,
    score: 0,
    best: Number(localStorage.getItem('flappyBananaBest') || 0),
    t: 0
  };

  const banana = {
    x: 110,
    y: 300,
    vy: 0,
    w: 82,
    h: 62,
    rot: 0
  };

  const physics = {
    gravity: 0.42,
    flap: -7.6,
    maxFall: 10,
    spin: 0.16
  };

  let obstacles = [];
  let spawnTimer = 0;
  const obstacleSpeed = 3.25;

  function reset() {
    state.started = false;
    state.over = false;
    state.score = 0;
    state.t = 0;
    banana.x = W * 0.24;
    banana.y = H * 0.43;
    banana.vy = 0;
    banana.rot = 0;
    obstacles = [];
    spawnTimer = 0;
  }

  function flap() {
    if (state.over) {
      reset();
      state.started = true;
    } else if (!state.started) {
      state.started = true;
    }
    banana.vy = physics.flap;
    banana.rot -= 0.12;
  }

  function input(e) {
    if (e) e.preventDefault();
    flap();
  }

  wrap.addEventListener('pointerdown', input);
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') input(e);
  });

  function spawnObstacle() {
    const gap = Math.max(155, H * 0.215);
    const margin = 100;
    const center = margin + gap/2 + Math.random() * (H - margin*2 - gap);
    obstacles.push({
      x: W + 80,
      width: 72,
      topEnd: center - gap/2,
      bottomStart: center + gap/2,
      scored: false
    });
  }

  function bananaBounds() {
    const padX = 12, padY = 9;
    return {
      l: banana.x - banana.w/2 + padX,
      r: banana.x + banana.w/2 - padX,
      t: banana.y - banana.h/2 + padY,
      b: banana.y + banana.h/2 - padY
    };
  }

  function rectHit(a, b) {
    return a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
  }

  function checkCollision() {
    const b = bananaBounds();

    if (b.t <= 0 || b.b >= H) return true;

    for (const o of obstacles) {
      const topRect = { l: o.x, r: o.x + o.width, t: 0, b: o.topEnd };
      const botRect = { l: o.x, r: o.x + o.width, t: o.bottomStart, b: H };
      if (rectHit(b, topRect) || rectHit(b, botRect)) return true;
    }
    return false;
  }

  function gameOver() {
    state.over = true;
    state.started = false;
    if (state.score > state.best) {
      state.best = state.score;
      localStorage.setItem('flappyBananaBest', state.best);
    }
  }

  function update() {
    state.t++;

    if (!state.started || state.over) {
      if (!state.over) banana.y += Math.sin(state.t * 0.06) * 0.25;
      return;
    }

    banana.vy = Math.min(physics.maxFall, banana.vy + physics.gravity);
    banana.y += banana.vy;
    banana.rot += physics.spin + banana.vy * 0.005;

    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = Math.max(75, Math.floor(105 - state.score * 1.2));
    }

    for (const o of obstacles) {
      o.x -= obstacleSpeed + Math.min(2, state.score * 0.04);

      if (!o.scored && o.x + o.width < banana.x) {
        o.scored = true;
        state.score++;
      }
    }

    obstacles = obstacles.filter(o => o.x + o.width > -100);

    if (checkCollision()) gameOver();
  }

  function roundRect(x,y,w,h,r) {
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#80ddff');
    g.addColorStop(1, '#d7f5ff');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // nuvens
    ctx.fillStyle = 'rgba(255,255,255,.72)';
    for (let i=0; i<5; i++) {
      const x = ((i*145 + state.t*0.18) % (W+190)) - 95;
      const y = 80 + (i%3)*95;
      ctx.beginPath();
      ctx.arc(x, y, 25, 0, Math.PI*2);
      ctx.arc(x+28, y-8, 31, 0, Math.PI*2);
      ctx.arc(x+60, y+2, 23, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawKnife(x, yTip, length, dir) {
    // dir 1 = lâmina aponta para baixo, -1 = aponta para cima
    const w = 64;
    const handleH = 44;
    const bladeH = Math.max(40, length - handleH);

    ctx.save();
    ctx.translate(x + w/2, yTip);
    if (dir < 0) ctx.scale(1,-1);

    // lâmina
    ctx.beginPath();
    ctx.moveTo(-w*0.36, 0);
    ctx.lineTo(w*0.36, 0);
    ctx.lineTo(w*0.26, bladeH);
    ctx.lineTo(-w*0.12, bladeH + 20);
    ctx.closePath();
    const bladeGrad = ctx.createLinearGradient(-w/2,0,w/2,0);
    bladeGrad.addColorStop(0,'#d9dde1');
    bladeGrad.addColorStop(.5,'#ffffff');
    bladeGrad.addColorStop(1,'#9ea6ad');
    ctx.fillStyle = bladeGrad;
    ctx.fill();
    ctx.strokeStyle = '#565c62';
    ctx.lineWidth = 3;
    ctx.stroke();

    // cabo
    const hy = bladeH + 12;
    ctx.fillStyle = '#232323';
    roundRect(-22, hy, 44, handleH, 8);
    ctx.fill();
    ctx.strokeStyle = '#101010';
    ctx.lineWidth = 3;
    ctx.stroke();

    // rebites
    ctx.fillStyle = '#c8c8c8';
    ctx.beginPath();
    ctx.arc(0, hy+13, 4, 0, Math.PI*2);
    ctx.arc(0, hy+31, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function drawObstacles() {
    for (const o of obstacles) {
      // faca de cima: ponta virada para o vão
      const topLength = Math.max(80, o.topEnd);
      drawKnife(o.x + 4, o.topEnd, topLength, -1);

      // faca de baixo
      const bottomLength = Math.max(80, H - o.bottomStart);
      drawKnife(o.x + 4, o.bottomStart, bottomLength, 1);
    }
  }

  function drawBanana() {
    ctx.save();
    ctx.translate(banana.x, banana.y);
    ctx.rotate(banana.rot);

    const shadowW = banana.w * 0.68;
    ctx.fillStyle = 'rgba(0,0,0,.13)';
    ctx.beginPath();
    ctx.ellipse(3, banana.h*0.45, shadowW/2, 8, 0, 0, Math.PI*2);
    ctx.fill();

    if (bananaImg.complete) {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(bananaImg, -banana.w/2, -banana.h/2, banana.w, banana.h);
    } else {
      ctx.fillStyle = '#ffd400';
      ctx.font = '48px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🍌', 0, 0);
    }
    ctx.restore();
  }

  function drawHUD() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.lineJoin = 'round';

    ctx.font = 'bold 54px Arial';
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.strokeText(String(state.score), W/2, 26);
    ctx.fillStyle = '#fff';
    ctx.fillText(String(state.score), W/2, 26);

    ctx.textAlign = 'left';
    ctx.font = 'bold 16px Arial';
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillText('RECORDE: ' + state.best, 14, 14);
  }

  function drawStart() {
    if (state.started || state.over) return;
    ctx.save();
    ctx.textAlign = 'center';

    ctx.font = '900 42px Arial';
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(0,0,0,.3)';
    ctx.strokeText('FLAPPY BANANA', W/2, H*0.18);
    ctx.fillStyle = '#ffe100';
    ctx.fillText('FLAPPY BANANA', W/2, H*0.18);

    ctx.font = 'bold 19px Arial';
    ctx.fillStyle = '#333';
    ctx.fillText('Desvie das facas!', W/2, H*0.18 + 42);
    ctx.restore();
  }

  function drawGameOver() {
    if (!state.over) return;

    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fillRect(0,0,W,H);

    const boxW = Math.min(360, W-36);
    const boxH = 210;
    const x = (W-boxW)/2;
    const y = H*0.28;

    ctx.fillStyle = 'rgba(255,255,255,.95)';
    roundRect(x,y,boxW,boxH,18);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#d64242';
    ctx.font = '900 34px Arial';
    ctx.fillText('FATIADA! 🍌🔪', W/2, y+50);

    ctx.fillStyle = '#222';
    ctx.font = 'bold 21px Arial';
    ctx.fillText('Pontos: ' + state.score, W/2, y+98);
    ctx.fillText('Recorde: ' + state.best, W/2, y+130);

    ctx.font = 'bold 15px Arial';
    ctx.fillStyle = '#555';
    ctx.fillText('Clique para jogar novamente', W/2, y+173);
  }

  function render() {
    drawSky();
    drawObstacles();
    drawBanana();
    drawHUD();
    drawStart();
    drawGameOver();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  reset();
  loop();
})();
</script>
</body>
</html>
